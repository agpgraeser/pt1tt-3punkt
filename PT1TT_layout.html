<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>PTn-Parameter Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            height: 100vh;
        }

        .left-panel {
            background: #ffffff;
            padding: 16px 20px;
            box-shadow: 2px 0 4px rgba(0,0,0,0.05);
            overflow-y: auto;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: #fafafa;
            overflow: hidden;
        }

        #plotArea {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .panel-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .section {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .left-panel .field-row-compact {
            display: grid;
            grid-template-columns: auto 80px auto 80px auto 80px;
            column-gap: 6px;
            row-gap: 4px;
            align-items: center;
            margin-bottom: 8px;
        }

        .left-panel .field-row-single {
            display: grid;
            grid-template-columns: auto 80px;
            column-gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .left-panel .field-row-compact label,
        .left-panel .field-row-single label {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
        }

        .left-panel .field-row-compact input,
        .left-panel .field-row-single input {
            width: 80px;
            padding: 4px 6px;
            font-size: 0.85rem;
            border-radius: 3px;
            border: 1px solid #ccc;
            text-align: right;
            box-sizing: border-box;
        }

        .left-panel input.output {
            background: #e5f7e5;
            border: 1px solid #b2d8b2;
        }

        .invalid {
            background: #ffcccc !important;
            border-color: #ff4444 !important;
        }

        

    </style>
</head>

<body>


<div class="app-container">

    <!-- Linkes Drittel -->
    <div class="left-panel">

        <!-- PT1TT-Parameter -->
        <div class="section">
            <div class="panel-title">PT1TT-Parameter berechnen</div>

            <div class="field-row-compact">
                <label for="XA">XA</label>
                <input type="number" id="XA" value="0.00" step="0.01">
                <label for="XE">XE</label>
                <input type="number" id="XE" value="1.00" step="0.01">
                <label for="DX">DX</label>
                <input type="number" id="DX" class="output" value="1.00" readonly>
            </div>

            <div class="field-row-compact">
                <label for="YA">YA</label>
                <input type="number" id="YA" value="0.00" step="0.01">

                <label for="YE">YE</label>
                <input type="number" id="YE" value="1.00" step="0.01">

                <label for="DY">DY</label>
                <input type="number" id="DY" class="output" value="1.00" readonly>

            </div>

            <div class="field-row-single">
                <label for="t0">t₀</label>
                <input type="number" id="t0" value="-100.0" step="0.1">
            </div>
        </div>

        <!-- ZPK / 3-Punkt Methode -->
        <div class="section">
            <div class="panel-title">ZPK / 3-Punkt Methode</div>

            <div class="field-row-compact">
                <label for="X10">X10</label>
                <input type="number" id="X10" class="output" value="0.00" readonly>
                <label for="t10">t10</label>
                <input type="number" id="t10" value="0.00" step="0.01">
                <div></div><div></div>
            </div>

            <div class="field-row-compact">
                <label for="X50">X50</label>
                <input type="number" id="X50" class="output" value="0.00" readonly>
                <label for="t50">t50</label>
                <input type="number" id="t50" value="0.00" step="0.01">
                <div></div><div></div>
            </div>

            <div class="field-row-compact">
                <label for="X90">X90</label>
                <input type="number" id="X90" class="output" value="0.00" readonly>
                <label for="t90">t90</label>
                <input type="number" id="t90" value="0.00" step="0.01">
                <div></div><div></div>
            </div>
        </div>
        <div class="section">
            <div class="panel-title">Berechnete Kennwerte</div>

            <div class="field-row-compact">
                <label for="kS">kS</label>
                <input type="number" id="kS" class="output" readonly>

                <label for="TT">TT</label>
                <input type="number" id="TT" class="output" readonly>

                <label for="TG">TG</label>
                <input type="number" id="TG" class="output" readonly>
            </div>
        </div>

        

        <div class="section">
            <div class="panel-title">Messdaten laden</div>

            <input type="file" id="excelFile" accept=".xlsx,.xls" />
            <div id="fileInfo" style="font-size:0.8rem; color:#555; margin-top:6px;"></div>
        </div>

        <!-- Weitere Einstellungen -->
        <div class="section">
            <div class="panel-title">Weitere Einstellungen (Platzhalter)</div>
        </div>
    </div> <!-- Ende left-panel -->

    <!-- Rechtes Zweidrittel -->
    <div class="right-panel">
    <div id="plotArea" style="width:100%; height:100%;"></div>

    </div>




</div>
<!-- ========================= -->
<!-- 1) Externe Bibliotheken -->
<!-- ========================= -->
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
console.log("JS geladen");

/* ---------------------------------------------------------
   DOM-Referenzen
--------------------------------------------------------- */
const XA = document.getElementById("XA");
const XE = document.getElementById("XE");
const DX = document.getElementById("DX");

const YA = document.getElementById("YA");
const YE = document.getElementById("YE");
const DY = document.getElementById("DY");


const t0  = document.getElementById("t0");
const t10 = document.getElementById("t10");
const t50 = document.getElementById("t50");
const t90 = document.getElementById("t90");

const X10 = document.getElementById("X10");
const X50 = document.getElementById("X50");
const X90 = document.getElementById("X90");

const kS  = document.getElementById("kS");
const TT  = document.getElementById("TT");
const TG  = document.getElementById("TG");

const excelInput = document.getElementById("excelFile");
const fileInfo   = document.getElementById("fileInfo");

/* ---------------------------------------------------------
   Datencontainer für Excel
--------------------------------------------------------- */
let timeData = [];
let yData = [];
let uData = [];
let systemName = "";
let varNames = {};
let units = {};
let fileName = "";

/* ---------------------------------------------------------
   Hilfsfunktionen
--------------------------------------------------------- */
function isValidNumber(el) {
    if (!el) return false;
    const v = parseFloat(el.value);
    return !(isNaN(v) || !isFinite(v));
}

function updateFieldStyle(el) {
    if (!el) return;
    if (isValidNumber(el)) el.classList.remove("invalid");
    else el.classList.add("invalid");
}

/* ---------------------------------------------------------
   DX = XE - XA
--------------------------------------------------------- */
function updateDX() {
    updateFieldStyle(XA);
    updateFieldStyle(XE);

    if (isValidNumber(XA) && isValidNumber(XE)) {
        const xa = parseFloat(XA.value);
        const xe = parseFloat(XE.value);
        DX.value = (xe - xa).toFixed(2);
        updateXvalues();
    } else {
        DX.value = "";
        X10.value = "";
        X50.value = "";
        X90.value = "";
    }

    updateDerivedValues();
}

/* ---------------------------------------------------------
   DY = YE - YA
--------------------------------------------------------- */
function updateDY() {
    updateFieldStyle(YA);
    updateFieldStyle(YE);

    if (isValidNumber(YA) && isValidNumber(YE)) {
        const ya = parseFloat(YA.value);
        const ye = parseFloat(YE.value);
        DY.value = (ye - ya).toFixed(2);
    } else {
        DY.value = "";
    }

    updateDerivedValues();
}


/* ---------------------------------------------------------
   X10/X50/X90 berechnen
--------------------------------------------------------- */
function updateXvalues() {
    if (!isValidNumber(XA) || !isValidNumber(DX)) {
        X10.value = "";
        X50.value = "";
        X90.value = "";
        return;
    }

    const xa = parseFloat(XA.value);
    const dx = parseFloat(DX.value);

    X10.value = (xa + 0.1 * dx).toFixed(2);
    X50.value = (xa + 0.5 * dx).toFixed(2);
    X90.value = (xa + 0.9 * dx).toFixed(2);
}

/* ---------------------------------------------------------
   Zeitvalidierung
--------------------------------------------------------- */
function updateTimeOrder() {
    updateFieldStyle(t0);
    updateFieldStyle(t10);
    updateFieldStyle(t50);
    updateFieldStyle(t90);

    if (!isValidNumber(t0) || !isValidNumber(t10) || !isValidNumber(t50) || !isValidNumber(t90))
        return;

    const t0v  = parseFloat(t0.value);
    const t10v = parseFloat(t10.value);
    const t50v = parseFloat(t50.value);
    const t90v = parseFloat(t90.value);

    // 🔴 Prüfung: t0 >= 0
    if (t0v < 0) {
        t0.classList.add("invalid");
    }

    // 🔴 Prüfung: t10 > t0
    if (t10v <= t0v) t10.classList.add("invalid");

    // 🔴 Prüfung: t50 > t0
    if (t50v <= t0v) t50.classList.add("invalid");

    // 🔴 Prüfung: t90 > t0
    if (t90v <= t0v) t90.classList.add("invalid");

    // 🔴 Prüfung: t10 < t50
    if (!(t10v < t50v)) {
        t10.classList.add("invalid");
        t50.classList.add("invalid");
    }

    // 🔴 Prüfung: t50 < t90
    if (!(t50v < t90v)) {
        t50.classList.add("invalid");
        t90.classList.add("invalid");
    }

    updateDerivedValues();
}


/* ---------------------------------------------------------
   Relative Zeiten + kS, TT, TG
--------------------------------------------------------- */
function updateDerivedValues() {
    if (!isValidNumber(t0) || !isValidNumber(t10) || !isValidNumber(t50) || !isValidNumber(t90)) {
        kS.value = "";
        TT.value = "";
        TG.value = "";
        return;
    }

    const t0v  = parseFloat(t0.value);
    const t10v = parseFloat(t10.value);
    const t50v = parseFloat(t50.value);
    const t90v = parseFloat(t90.value);

    const t10_rel = t10v - t0v;
    const t50_rel = t50v - t0v;
    const t90_rel = t90v - t0v;

    if (isValidNumber(DX) && isValidNumber(DY) && parseFloat(DY.value) !== 0) {
        kS.value = (parseFloat(DX.value) / parseFloat(DY.value)).toFixed(4);
    } else {
        kS.value = "";
    }


    TT.value = ((t10_rel - 0.046 * t90_rel) / 0.954).toFixed(3);
    const tt = parseFloat(TT.value);
    const t10_corr = t10_rel - tt;
    const t50_corr = t50_rel - tt;
    const t90_corr = t90_rel - tt;
    TG.value = ((9.491 * t10_corr + 1.443 * t50_corr + 0.434 * t90_corr) / 3).toFixed(3);
}

/* ---------------------------------------------------------
   Modellantwort (PT1TT)
--------------------------------------------------------- */
function computeModelResponse() {
    const XM = [];

    const xa = parseFloat(XA.value);
    const dy = parseFloat(DY.value);
    const ks = parseFloat(kS.value);
    const tt = parseFloat(TT.value);
    const tg = parseFloat(TG.value);
    const t0v = parseFloat(t0.value);

    const tDelay = t0v + tt;

    for (let i = 0; i < timeData.length; i++) {
        const t = timeData[i];

        if (t <= tDelay) {
            XM.push(xa);
        } else {
            const exponent = -(t - tDelay) / tg;
            XM.push(xa + ks * dy * (1 - Math.exp(exponent)));
        }
    }

    return XM;
}

/* ---------------------------------------------------------
   Excel einlesen
--------------------------------------------------------- */
excelInput.addEventListener("change", handleExcelFile);

function handleExcelFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    fileName = file.name.replace(/\.[^/.]+$/, "");

    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        parseExcelStructure(rows);
        fileInfo.innerText = "Geladen: " + file.name;
        plotData();
    };

    reader.readAsArrayBuffer(file);
}

/* ---------------------------------------------------------
   Struktur A/B/C erkennen
--------------------------------------------------------- */
function parseExcelStructure(rows) {
    timeData = [];
    yData = [];
    uData = [];

    const first = rows[0];
    const second = rows[1];
    const third = rows[2];

    const isC =
        first && typeof first[0] === "string" &&
        second && typeof second[0] === "string" &&
        third;

    if (isC) {
        systemName = first[0];
        varNames.time = second[0] || "Zeit";
        varNames.y    = second[1] || "Y";
        varNames.u    = second[2] || "U";

        units.time = third[0] || "";
        units.y    = third[1] || "";
        units.u    = third[2] || "";

        for (let i = 3; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length < 2) continue;
            timeData.push(r[0]);
            yData.push(r[1]);
            if (r.length >= 3) uData.push(r[2]);
        }
        return;
    }

    const hasU = rows[0] && rows[0].length >= 3;

    for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        if (!r || r.length < 2) continue;
        timeData.push(r[0]);
        yData.push(r[1]);
        if (hasU) uData.push(r[2]);
    }

    systemName = fileName;
    varNames = { time: "Zeit", y: "Y", u: hasU ? "U" : null };
    units = { time: "", y: "", u: "" };
}

/* ---------------------------------------------------------
   Plot-Funktion
--------------------------------------------------------- */
function plotData() {
    if (timeData.length === 0) return;

    const XM = computeModelResponse();

    const traceY = {
        x: timeData,
        y: yData,
        mode: "lines",
        name: "Messwert Y",
        line: { width: 2, color: "blue" }
    };

    const traceU = {
        x: timeData,
        y: uData,
        mode: "lines",
        name: "Eingang U",
        line: { width: 2, color: "red" }
    };

    const traceModel = {
        x: timeData,
        y: XM,
        mode: "lines",
        name: "Modellantwort",
        line: { width: 2, color: "orange", dash: "dot" }
    };

    const t0v  = parseFloat(t0.value);
    const t10v = parseFloat(t10.value);
    const t50v = parseFloat(t50.value);
    const t90v = parseFloat(t90.value);

    const X10v = parseFloat(X10.value);
    const X50v = parseFloat(X50.value);
    const X90v = parseFloat(X90.value);

    const yMin = Math.min(...yData);
    const xMin = Math.min(...timeData);

    const shapes = [
        // t0
        {
            type: "line",
            x0: t0v,
            x1: t0v,
            y0: yMin,
            y1: Math.max(...yData),
            line: { color: "red", width: 2, dash: "dot" }
        },

        // horizontale Linien
        {
            type: "line",
            x0: xMin,
            x1: t10v,
            y0: X10v,
            y1: X10v,
            line: { color: "green", width: 1, dash: "dash" }
        },
        {
            type: "line",
            x0: xMin,
            x1: t50v,
            y0: X50v,
            y1: X50v,
            line: { color: "green", width: 1, dash: "dash" }
        },
        {
            type: "line",
            x0: xMin,
            x1: t90v,
            y0: X90v,
            y1: X90v,
            line: { color: "green", width: 1, dash: "dash" }
        },

        // vertikale Linien
        {
            type: "line",
            x0: t10v,
            x1: t10v,
            y0: yMin,
            y1: X10v,
            line: { color: "blue", width: 1 }
        },
        {
            type: "line",
            x0: t50v,
            x1: t50v,
            y0: yMin,
            y1: X50v,
            line: { color: "blue", width: 1 }
        },
        {
            type: "line",
            x0: t90v,
            x1: t90v,
            y0: yMin,
            y1: X90v,
            line: { color: "blue", width: 1 }
        }
    ];

    Plotly.newPlot("plotArea", [traceY, traceU, traceModel], {
        margin: { t: 20, r: 20, b: 40, l: 50 },
        xaxis: { title: "Zeit" },
        yaxis: { title: "Wert" },
        shapes: shapes
    });
}

/* ---------------------------------------------------------
   Event‑Listener
--------------------------------------------------------- */
XA.addEventListener("input", () => { updateDX(); plotData(); });
XE.addEventListener("input", () => { updateDX(); plotData(); });

YA.addEventListener("input", () => { updateDY(); plotData(); });
YE.addEventListener("input", () => { updateDY(); plotData(); });


t0.addEventListener("input", () => { updateTimeOrder(); plotData(); });
t10.addEventListener("input", () => { updateTimeOrder(); plotData(); });
t50.addEventListener("input", () => { updateTimeOrder(); plotData(); });
t90.addEventListener("input", () => { updateTimeOrder(); plotData(); });

/* ---------------------------------------------------------
   Initiale Berechnung + Plot
--------------------------------------------------------- */
updateDX();
updateDY();
updateXvalues();
updateTimeOrder();
updateDerivedValues();
plotData();

</script>



</body>
</html>
