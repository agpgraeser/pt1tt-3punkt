<input type="file" id="excelFile" accept=".xlsx,.xls">
<label>
    <input type="checkbox" id="showDiff">
    Abweichung² anzeigen
</label>

<div id="plotArea" style="width:100%; height:600px;"></div>

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
let timeData = [];
let xData = [];
let yData = [];
let diffSq = [];

document.getElementById("excelFile").addEventListener("change", handleExcel);
document.getElementById("showDiff").addEventListener("change", plotData);

// ===============================
// Excel einlesen
// ===============================
function handleExcel(evt) {
    const file = evt.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        // Arrays leeren
        timeData = [];
        xData = [];
        yData = [];

        // Erste Zeile ist Header → ab Zeile 1 lesen
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 3) continue;

            timeData.push(parseFloat(row[0]));
            xData.push(parseFloat(row[1]));
            yData.push(parseFloat(row[2]));
        }

        // Δx² berechnen
        diffSq = xData.map((v, i) => (v - yData[i]) ** 2);

        plotData();
    };

    reader.readAsArrayBuffer(file);
}

// ===============================
// Plot-Funktion
// ===============================
function plotData() {
    if (timeData.length === 0) return;

    const showDiff = document.getElementById("showDiff").checked;

    // Dummy-Modell (kannst du ersetzen)
    const model = xData.map(v => v * 0.5 + 1);

    // --- Traces ---
    const traceX = {
        x: timeData,
        y: xData,
        mode: "lines",
        name: "x(t)",
        line: { width: 2, color: "blue" },
        xaxis: "x",
        yaxis: "y"
    };

    const traceModel = {
        x: timeData,
        y: model,
        mode: "lines",
        name: "Modell",
        line: { width: 2, color: "green" },
        xaxis: "x",
        yaxis: "y"
    };

    const traceY = {
        x: timeData,
        y: yData,
        mode: "lines",
        name: "y(t)",
        line: { width: 2, color: "orange" },
        xaxis: "x2",
        yaxis: "y2"
    };

    const traceDiff = {
        x: timeData,
        y: diffSq,
        mode: "lines",
        name: "Δx²(t)",
        line: { width: 2, color: "red" },
        xaxis: "x2",
        yaxis: "y2"
    };

    const traces = showDiff
        ? [traceX, traceModel, traceDiff]
        : [traceX, traceModel, traceY];

    // --- Layout ---
    const layout = {
        grid: { rows: 2, columns: 1, pattern: "independent" },

        xaxis:  { title: "Zeit", domain: [0, 1] },
        yaxis:  { title: "x(t)", domain: [0.35, 1] },

        xaxis2: { title: "Zeit", domain: [0, 1], anchor: "y2" },
        yaxis2: { title: showDiff ? "Δx²(t)" : "y(t)", domain: [0, 0.30] },

        margin: { t: 20, b: 40, l: 50, r: 20 }
    };

    Plotly.newPlot("plotArea", traces, layout);
}
</script>
